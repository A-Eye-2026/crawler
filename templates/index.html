<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>생활기상지수 지도</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
  <header class="app-header">
    <div class="header-title">
      <h1>생활기상지수 지도</h1>
      <p>체감온도 · 자외선 · 대기정체 지수를 지도에 표시합니다.</p>
    </div>
    <div class="header-actions">
      <label for="code-select">지수 선택</label>
      <select id="code-select">
        <optgroup label="체감온도 (5~9월)">
          {% for code, label in sensation_codes.items() %}
          <option value="{{ code }}">{{ label }}</option>
          {% endfor %}
        </optgroup>
        <optgroup label="기타 지수">
          {% for code, label in extra_codes.items() %}
          <option value="{{ code }}">{{ label }}</option>
          {% endfor %}
        </optgroup>
      </select>
      <button id="refresh-button" type="button">새로고침</button>
    </div>
  </header>

  <div class="controls-bar">
    <div class="control-group">
      <label for="time-slider">예보 시간</label>
      <div class="slider-wrap">
        <span id="slider-min-label" class="slider-edge">+1h</span>
        <input type="range" id="time-slider" min="1" max="78" value="1" step="1" />
        <span id="slider-max-label" class="slider-edge">+78h</span>
      </div>
      <span id="slider-label" class="slider-label">+1시간 후</span>
    </div>

    <div class="control-group">
      <label for="threshold-input">경고 임계값</label>
      <div class="threshold-wrap">
        <input type="number" id="threshold-input" value="35" min="0" max="100" step="0.5" />
        <span id="threshold-unit">°C</span>
      </div>
    </div>

    <div id="warning-badge" class="warning-badge hidden">
      <span id="warning-count">0</span>개 지점 경고
    </div>
  </div>

  <main class="layout">
    <section id="map"></section>
    <aside class="sidebar">
      <h2>상세 정보</h2>
      <div id="summary-card" class="summary-card">
        <p>지도에서 지점을 선택해 주세요.</p>
      </div>
      <div class="legend">
        <h3 id="legend-title">범례</h3>
        <ul id="legend-list"></ul>
      </div>
      <div id="status-bar" class="status-bar"></div>
    </aside>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
